version: '3'

silent: true

vars:
  BINARY: goworktree
  TOOLS_BIN: '{{.ROOT_DIR}}/.tools/bin'
  GOLANGCI_LINT: '{{.TOOLS_BIN}}/golangci-lint'
  GOLANGCI_LINT_VERSION: 2.12.2

tasks:
  default:
    desc: Run the canonical development pipeline
    cmds:
      - task: tidy
      - task: fmt
      - task: lint
      - task: test

  build:
    desc: Build binary to ./{{.BINARY}}
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'
    cmds:
      - go build -o {{.BINARY}} .

  install:
    desc: Install to $GOPATH/bin
    deps: [build]
    cmds:
      - go install .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}

  check-deps:
    desc: Check external dependencies (git, cursor)
    cmds:
      - |
        command -v git >/dev/null || { echo "missing: git"; exit 1; }
        echo "ok: git"
        if command -v cursor >/dev/null; then
          echo "ok: cursor"
        elif [ -x /Applications/Cursor.app/Contents/MacOS/Cursor ]; then
          echo "ok: Cursor.app"
        else
          echo "optional: cursor not found"
        fi

  init:
    desc: Interactive first-time setup
    deps: [build]
    cmds:
      - ./{{.BINARY}} init

  start:
    desc: Create or resume typed New Work (pass name and --repos via CLI_ARGS)
    deps: [build]
    cmds:
      - ./{{.BINARY}} start {{.CLI_ARGS}}

  add:
    desc: Add repositories to an existing project
    deps: [build]
    cmds:
      - ./{{.BINARY}} add {{.CLI_ARGS}}

  drop:
    desc: Drop repositories from a project (-D deletes local branches)
    deps: [build]
    cmds:
      - ./{{.BINARY}} drop {{.CLI_ARGS}}

  sync:
    desc: Run typed Sync Work against fetched immutable base OIDs
    deps: [build]
    cmds:
      - ./{{.BINARY}} sync {{.CLI_ARGS}}

  branch:
    desc: Adopt a repository worktree's current branch
    deps: [build]
    cmds:
      - ./{{.BINARY}} branch {{.CLI_ARGS}}

  list:
    desc: List worktree projects
    deps: [build]
    cmds:
      - ./{{.BINARY}} list

  remove:
    desc: Run typed Remove Work (--confirm must equal the exact Work name)
    deps: [build]
    cmds:
      - ./{{.BINARY}} remove {{.CLI_ARGS}}

  archives:
    desc: List, inspect, or delete removed-Work metadata archives
    deps: [build]
    cmds:
      - ./{{.BINARY}} archives {{.CLI_ARGS}}

  doctor:
    desc: Check git, editors, and config
    deps: [build]
    cmds:
      - ./{{.BINARY}} doctor

  repair:
    desc: Apply deterministic typed Repair Work actions
    deps: [build]
    cmds:
      - ./{{.BINARY}} repair {{.CLI_ARGS}}

  cursor:
    desc: Open project in Cursor (picker if no name)
    deps: [build]
    cmds:
      - ./{{.BINARY}} cursor {{.CLI_ARGS}}

  goland:
    desc: Open project in GoLand (picker if no name)
    deps: [build]
    cmds:
      - ./{{.BINARY}} goland {{.CLI_ARGS}}

  config:
    desc: Show configuration
    deps: [build]
    cmds:
      - ./{{.BINARY}} config show

  repos:scan:
    desc: Rescan repositories root
    deps: [build]
    cmds:
      - ./{{.BINARY}} repos scan

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Check Go formatting without changing files
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "Go files require formatting:"
          echo "$unformatted"
          exit 1
        fi

  tools:install:
    desc: Install pinned development tools into .tools/bin
    status:
      - test -x "{{.GOLANGCI_LINT}}"
      - '"{{.GOLANGCI_LINT}}" version 2>&1 | grep -q "version {{.GOLANGCI_LINT_VERSION}} "'
    cmds:
      - mkdir -p "{{.TOOLS_BIN}}"
      - 'curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "{{.TOOLS_BIN}}" v{{.GOLANGCI_LINT_VERSION}}'

  lint:
    desc: Run pinned local static analysis
    preconditions:
      - sh: test -x "{{.GOLANGCI_LINT}}"
        msg: "local golangci-lint is missing; run: task tools:install"
    cmds:
      - |
        version_output="$("{{.GOLANGCI_LINT}}" version 2>&1)"
        case "$version_output" in
          *"version {{.GOLANGCI_LINT_VERSION}} "*) ;;
          *)
            echo "golangci-lint {{.GOLANGCI_LINT_VERSION}} is required"
            echo "$version_output"
            exit 1
            ;;
        esac
      - '"{{.GOLANGCI_LINT}}" run ./...'

  check:
    desc: Run deterministic local quality checks
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  dev:
    desc: Build and run with arbitrary args (task dev -- help)
    deps: [build]
    cmds:
      - ./{{.BINARY}} {{.CLI_ARGS}}
